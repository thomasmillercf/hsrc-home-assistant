- id: hsrc_basket_unbooked_sessions
  alias: HSRC - add unbooked sessions to basket
  description: When newly released EARLY sessions are not booked, adds them to the hsrc.info basket and says so.
  triggers:
    - trigger: state
      entity_id: sensor.hsrc_unbooked_early_sessions
      not_from: [unavailable, unknown]
      not_to: [unavailable, unknown]
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.state | int(0) > trigger.from_state.state | int(0) }}"
  actions:
    - action: button.press
      target:
        entity_id: button.hsrc_add_unbooked_early_sessions_to_basket
    - variables:
        sessions: "{{ state_attr('sensor.hsrc_unbooked_early_sessions', 'sessions') or [] }}"
        in_basket: "{{ sessions | selectattr('in_basket') | list }}"
        full: "{{ sessions | rejectattr('in_basket') | list }}"
    - condition: template
      value_template: "{{ sessions | count > 0 }}"
    - action: notify.mobile_app_sm_s938b
      data:
        title: HSRC early sessions not booked
        message: >-
          {% if in_basket %}In your basket:
          {% for session in in_basket %}{{ as_datetime(session.date).strftime('%a %-d %b') }}{{ ', ' if not loop.last }}{% endfor %}. Tap to pay.{% endif %}
          {% if full %}Full:
          {% for session in full %}{{ as_datetime(session.date).strftime('%a %-d %b') }}{{ ', ' if not loop.last }}{% endfor %}.{% endif %}
        data:
          url: https://hsrc.info/index.php?main_page=shopping_cart
          clickAction: https://hsrc.info/index.php?main_page=shopping_cart
          ttl: 0
          priority: high
  mode: queued

- id: hsrc_friday_booking_reminder
  alias: HSRC - Friday booking reminder
  description: On Friday evening, if Monday's EARLY session is not booked, adds it to the basket and reminds.
  triggers:
    - trigger: time
      at: "18:00:00"
      weekday: fri
  actions:
    - action: homeassistant.update_entity
      target:
        entity_id: binary_sensor.hsrc_next_early_session_booked
    - condition: state
      entity_id: binary_sensor.hsrc_next_early_session_booked
      state: "off"
    - action: button.press
      target:
        entity_id: button.hsrc_add_unbooked_early_sessions_to_basket
    - variables:
        start: "{{ state_attr('binary_sensor.hsrc_next_early_session_booked', 'start') }}"
        places_left: "{{ state_attr('binary_sensor.hsrc_next_early_session_booked', 'places_left') }}"
    - action: notify.mobile_app_sm_s938b
      data:
        title: Book HSRC early training
        message: >-
          {{ as_datetime(start).strftime('%A %-d %B') }} is not booked.
          {% if places_left is none or places_left > 0 %}It's in your basket, tap to pay.{% else %}It's full.{% endif %}
        data:
          url: https://hsrc.info/index.php?main_page=shopping_cart
          clickAction: https://hsrc.info/index.php?main_page=shopping_cart
          ttl: 0
          priority: high
  mode: single

- id: hsrc_monday_session_status
  alias: HSRC - Monday session status
  description: Says at 3pm on Monday whether tonight's EARLY session is booked.
  triggers:
    - trigger: time
      at: "15:00:00"
      weekday: mon
  actions:
    - action: homeassistant.update_entity
      target:
        entity_id: binary_sensor.hsrc_next_early_session_booked
    - variables:
        places_left: "{{ state_attr('binary_sensor.hsrc_next_early_session_booked', 'places_left') }}"
        tonight: "{{ state_attr('binary_sensor.hsrc_next_early_session_booked', 'date') == now().date().isoformat() }}"
        booked: "{{ is_state('binary_sensor.hsrc_next_early_session_booked', 'on') }}"
    - action: notify.mobile_app_sm_s938b
      data:
        title: >-
          {% if not tonight %}No HSRC training tonight{% elif booked %}HSRC training booked tonight
          {% else %}HSRC training not booked tonight{% endif %}
        message: >-
          {% if not tonight %}There is no EARLY session listed for today.
          {% elif booked %}EARLY session 6:00pm to 7:25pm is booked.
          {% else %}EARLY session at 6:00pm is not booked{% if places_left is not none %}, {{ places_left }} places left{% endif %}.{% endif %}
        data:
          url: "{{ 'https://hsrc.info/index.php?main_page=shopping_cart' if tonight and not booked else 'https://hsrc.info/index.php?main_page=account_history' }}"
          clickAction: "{{ 'https://hsrc.info/index.php?main_page=shopping_cart' if tonight and not booked else 'https://hsrc.info/index.php?main_page=account_history' }}"
          ttl: 0
          priority: high
  mode: single
